name: ApplyLens CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "sprint-*"
      - "codex/sprint-*"
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Compile backend modules
        run: python -m compileall -q app

      - name: Run backend tests
        run: python -m pytest tests -q

      - name: Run deployment smoke-check tests
        working-directory: .
        run: python -m unittest deploy.test_smoke_test -v

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        run: npm test

  containers:
    name: Container builds
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-placeholder
      DATABASE_URL: postgresql://applylens:ci-placeholder@postgres:5432/applylens
      WEB_ORIGIN: https://staging.example.com
      PUBLIC_API_URL: https://api.staging.example.com
      EMAIL_DELIVERY: smtp
      SMTP_HOST: smtp.example.com
      SMTP_USERNAME: ci-placeholder
      SMTP_PASSWORD: ci-placeholder
      SMTP_FROM_EMAIL: support@example.com
      SUPPORT_EMAIL: support@example.com
      INCIDENT_CONTACT_EMAIL: incident-response@example.com
      STAGING_WEB_HOST: staging.example.com
      STAGING_API_HOST: api.staging.example.com
      TLS_EMAIL: operations@example.com
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate Compose configuration
        run: docker compose config

      - name: Validate production Compose configuration
        run: docker compose -f docker-compose.production.yml config

      - name: Validate staging Compose configuration
        run: docker compose -f docker-compose.production.yml -f docker-compose.staging.yml config

      - name: Validate staging HTTPS proxy configuration
        run: >-
          docker run --rm
          -v "${{ github.workspace }}/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          -e STAGING_WEB_HOST
          -e STAGING_API_HOST
          -e TLS_EMAIL
          caddy:2-alpine
          caddy validate --config /etc/caddy/Caddyfile

      - name: Build API and frontend images
        run: docker compose build api web

      - name: Build production API and frontend images
        run: docker compose -f docker-compose.production.yml build api web
