name: ApplyLens CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "sprint-*"
      - "codex/sprint-*"
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Compile backend modules
        run: python -m compileall -q app

      - name: Run backend tests
        run: python -m pytest tests -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        run: npm test

  containers:
    name: Container builds
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config

      - name: Validate production Compose configuration
        env:
          POSTGRES_PASSWORD: ci-placeholder
          DATABASE_URL: postgresql://applylens:ci-placeholder@postgres:5432/applylens
          WEB_ORIGIN: https://app.example.com
          PUBLIC_API_URL: https://api.example.com
        run: docker compose -f docker-compose.production.yml config

      - name: Build API and frontend images
        run: docker compose build api web

      - name: Build production API and frontend images
        env:
          POSTGRES_PASSWORD: ci-placeholder
          DATABASE_URL: postgresql://applylens:ci-placeholder@postgres:5432/applylens
          WEB_ORIGIN: https://app.example.com
          PUBLIC_API_URL: https://api.example.com
        run: docker compose -f docker-compose.production.yml build api web
