services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: applylens
      POSTGRES_USER: applylens
      POSTGRES_PASSWORD: applylens
    ports:
      - "5432:5432"
    volumes:
      - applylens-postgres:/var/lib/postgresql/data
      - ./apps/api/migrations/001_pgvector.sql:/docker-entrypoint-initdb.d/001_pgvector.sql:ro
      - ./apps/api/migrations/002_application_data.sql:/docker-entrypoint-initdb.d/002_application_data.sql:ro
      - ./apps/api/migrations/003_login_attempts.sql:/docker-entrypoint-initdb.d/003_login_attempts.sql:ro
      - ./apps/api/migrations/004_password_reset_tokens.sql:/docker-entrypoint-initdb.d/004_password_reset_tokens.sql:ro
      - ./apps/api/migrations/005_account_privacy.sql:/docker-entrypoint-initdb.d/005_account_privacy.sql:ro
      - ./apps/api/migrations/006_candidate_profiles.sql:/docker-entrypoint-initdb.d/006_candidate_profiles.sql:ro
      - ./apps/api/migrations/007_request_limits.sql:/docker-entrypoint-initdb.d/007_request_limits.sql:ro
      - ./apps/api/migrations/008_security_cleanup_indexes.sql:/docker-entrypoint-initdb.d/008_security_cleanup_indexes.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applylens -d applylens"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    environment:
      APP_ENV: development
      WEB_ORIGIN: http://localhost:8080
      DATABASE_URL: postgresql://applylens:applylens@postgres:5432/applylens
      RETRIEVAL_PROVIDER: lexical
      RETRIEVAL_STORAGE: memory
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/storage:/opt/applylens/apps/api/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_URL: http://localhost:8000
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  applylens-postgres:
