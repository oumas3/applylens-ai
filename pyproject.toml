[project]
name = "applylens-ai"
version = "0.1.0b1"
requires-python = ">=3.12,<3.13"
dependencies = [
    "email-validator==2.3.0",
    "fastapi==0.116.1",
    "httpx==0.28.1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings==2.10.1",
    "pypdf==6.14.2",
    "python-multipart==0.0.20",
]

[tool.vercel]
entrypoint = "vercel_app:app"

[tool.vercel.scripts]
build = "npm --prefix apps/web ci && npm --prefix apps/web run build"
