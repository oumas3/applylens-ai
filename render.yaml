services:
  - type: web
    name: applylens-ai-demo
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile.demo
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: WEB_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DOCUMENT_STORAGE
        value: database
      - key: DOCUMENT_MAX_PAGES
        value: "100"
      - key: DOCUMENT_MAX_EXTRACTED_CHARS
        value: "500000"
      - key: RETRIEVAL_PROVIDER
        value: lexical
      - key: RETRIEVAL_STORAGE
        value: memory
      - key: EMAIL_DELIVERY
        value: disabled
      - key: SUPPORT_EMAIL
        sync: false
      - key: INCIDENT_CONTACT_EMAIL
        sync: false
      - key: PRODUCT_VERSION
        value: 0.1.0-beta.1
      - key: RELEASE_CHANNEL
        value: free-public-beta
      - key: LOG_LEVEL
        value: INFO
